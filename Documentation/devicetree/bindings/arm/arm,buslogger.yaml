%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/arm,buslogger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: ARM FPGA Bus Logger
description: |
  This binding describes the ARM FPGA bus logger device.
maintainers:
  - ARM Ltd.
properties:
  compatible:
    items:
      - const: arm,buslogger
  reg:
    description: |
      Contains the three memory regions required by the buslogger:
      - The physical base address & length of the register bank
      - The physical base address & length of the memory aperture
      - The physical base address & length of the buslogger memory.
  reg-names:
    description: |
      Contains the names of memory resources, in the same order as provided in the reg property.
      Must contain: "REGISTER", "APERTURE", "MEMORY".
    $ref: /schemas/types.yaml#/definitions/string-array
  "arm,axi-max-outstanding":
    description: |
      The maximum number of outstanding AXI transactions.
    $ref: /schemas/types.yaml#/definitions/uint32
  "arm,axi-burst-length":
    description: |
      The AXI burst length.
    $ref: /schemas/types.yaml#/definitions/uint32
  "arm,pager-module":
    description: |
      The pager model variant (0 for none).
    $ref: /schemas/types.yaml#/definitions/uint32
required:
  - compatible
  - reg
  - reg-names
  - "arm,axi-max-outstanding"
  - "arm,axi-burst-length"
  - "arm,pager-module"
additionalProperties: true
examples:
  # Example for a buslogger on Juno
  - |
    buslogger@6f020000 {
        compatible = "arm,buslogger";
        reg = <0x0 0x6f020000 0x0 0x1000>,
              <0x0 0x60000000 0x0 0x8000000>,
              <0x0 0x0 0x0 0xFFF00000>;
        reg-names = "REGISTER", "APERTURE", "MEMORY";
        arm,axi-max-outstanding = <16>;
        arm,axi-burst-length = <16>;
        arm,pager-module = <1>;
    };
  # Example for a buslogger on kipling coherency platform
  - |
    buslogger@6f020000 {
        compatible = "arm,buslogger";
        reg = <0x2f010000 0x1000>,
              <0x0 0xfff00000>,
              <0x0 0xfff00000>;
        reg-names = "REGISTER", "APERTURE", "MEMORY";
        arm,axi-max-outstanding = <16>;
        arm,axi-burst-length = <16>;
        arm,pager-module = <0>;
    };
  # Example for a buslogger on versatile express A9 (Vertex 7)
  - |
    buslogger@fc020000 {
        compatible = "arm,buslogger";
        reg = <0xfc020000 0x1000>,
              <0x10000000 0xeff00000>,
              <0x00000000 0xfff00000>;
        reg-names = "REGISTER", "APERTURE", "MEMORY";
        arm,axi-max-outstanding = <16>;
        arm,axi-burst-length = <16>;
        arm,pager-module = <1>;
    };

