%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/arm,mali_fpga_sysctl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ARM Mali FPGA System Controller

description: |
  This binding describes the ARM Mali FPGA System Controller used in systems to enable
  access to the protected debugging mode on certain Mali GPUs (Bifrost). A "fpga_sysctl" node
  must be added to the device tree and must reserve the memory range required for the system
  controller's operation.

maintainers:
  - ARM Ltd.

select:
  properties:
    compatible:
      contains:
        enum:
          - arm,mali_fpga_sysctl
  required:
    - compatible

properties:
  compatible:
    items:
      - const: arm,mali_fpga_sysctl

  reg:
    description: |
      Memory range reserved for the system controller use.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    fpga_sysctl@6f020000 {
        compatible = "arm,mali_fpga_sysctl";
        reg = <0x0 0x6f020000 0x0 0x000000CC>;
    };

